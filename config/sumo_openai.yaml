# OpenAI-sumo-faithful run: make a DRAW hurt like a LOSS, no storm.
#
# Root-cause finding (from openai/multiagent-competition sumo.py): their agents
# actively push because a timed-out DRAW is scored -1000, exactly as bad as being
# pushed out. That destroys the cautious "don't commit, run out the clock"
# equilibrium -- the one that made our n=4 melee collapse to draws and our policy
# refuse to clear passive opponents. We reward survival, so drawing was SAFE.
#
# This config adopts their incentive:
#  - draw_penalty 1.0: a survivor that times out with opponents still alive is
#    charged the same magnitude as a death (-1) -> draw == loss, no free stall.
#    (Kept EQUAL to the death penalty, not worse, so there is no incentive to
#    self-eliminate instead -- the old suicide failure mode.)
#  - NO storm (min_radius_frac 1.0): with no closing boundary to resolve the game
#    for free, the ONLY way to avoid the draw penalty is to genuinely push every
#    opponent out. This is what should force pushing AND dominance (clearing
#    passive randoms) from a SINGLE policy -- the unification we could not get by
#    tuning geometry/storm alone.
#  - gamma 0.997: a terminal draw penalty at step ~600 is worth ~gamma**600 at
#    the episode start; the default 0.99 makes it invisible until the very end.
#    0.997 (~333-step horizon) lets the penalty reach the mid-game caution.
#  - radius 1.2 + 600 steps: small enough / long enough that clearing 3 targets
#    is physically feasible (proven by the earlier eval-time env sweep).
# Curriculum (n=2->4) + annealed aggression boost stay on (they bootstrap the
# shove behaviour); physics are the proven low-damping sumo settings.
arena:
  radius: 1.2
  wall_height: 0.5
  damping: 4.0
  min_radius_frac: 1.0    # NO storm -- pushing is the only way to win
  shrink_steps: 0
training:
  num_agents: 4
  curriculum_start_agents: 2
  total_steps: 1500000
  snapshot_interval: 10000
  max_force: 14.0
  snapshot_pool_size: 100
  episode_max_steps: 600
  draw_penalty: 1.0        # draw == loss (OpenAI sumo)
ppo:
  lr: 0.0003
  n_steps: 2048
  batch_size: 64
  clip_range: 0.2
  n_epochs: 10
  gamma: 0.997             # longer horizon so the draw penalty reaches the mid-game
evaluation:
  eval_freq: 10000
  num_episodes: 100
  generalization_agent_counts: [4, 6, 8]
