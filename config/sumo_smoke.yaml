arena:
  # Small ring + lower damping = classic sumo: agents are always in contact and
  # a shove sends the opponent sliding toward the edge. Pushing (not a storm) is
  # the way to win.
  radius: 1.6
  wall_height: 0.5
  damping: 4.0
  # Only a gentle, late storm as a draw-backstop; most eliminations should come
  # from pushing during the long stable phase.
  min_radius_frac: 0.4
  shrink_steps: 100
  shrink_delay: 300
training:
  num_agents: 4
  total_steps: 300000
  snapshot_interval: 10000
  max_force: 14.0
  snapshot_pool_size: 100
  episode_max_steps: 400
ppo:
  lr: 0.0003
  n_steps: 2048
  batch_size: 64
  clip_range: 0.2
  n_epochs: 10
evaluation:
  eval_freq: 10000
  num_episodes: 100
  generalization_agent_counts: [4, 6, 8]
