# draw=loss + LIGHTER agents: fix the braking-distance-vs-arena flaw.
#
# Physics probe: at the default ~7 kg mass an agent's braking distance from
# terminal velocity is ~5.5 m -- far larger than the ~1.2 m arena, so it
# physically cannot stop inside the ring once at speed. That drives BOTH
# self-ejection (overshoot) and caution (move slow or fly out). Dropping the
# collision-cylinder density to 150 (mass ~1.1 kg) cuts braking to ~0.96 m -- it
# fits the ring -- while keeping terminal velocity (~3.5) and making shoves
# displace opponents more. Paired with the OpenAI draw=loss incentive and no
# storm, this targets the n=4 self-ejection that capped dominance at -0.26.
arena:
  radius: 1.2
  wall_height: 0.5
  damping: 4.0
  agent_density: 150.0     # ~1.1 kg -> braking ~0.96 m < arena radius
  min_radius_frac: 1.0     # no storm
  shrink_steps: 0
training:
  num_agents: 4
  curriculum_start_agents: 2
  total_steps: 1500000
  snapshot_interval: 10000
  max_force: 14.0
  snapshot_pool_size: 100
  episode_max_steps: 600
  draw_penalty: 1.0
ppo:
  lr: 0.0003
  n_steps: 2048
  batch_size: 64
  clip_range: 0.2
  n_epochs: 10
  gamma: 0.997
evaluation:
  eval_freq: 10000
  num_episodes: 100
  generalization_agent_counts: [4, 6, 8]
