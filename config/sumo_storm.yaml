# Combined "sumo + storm" run (n=4, 1M steps).
#
# Goal: get agents to ACTIVELY PUSH each other out at n=4 -- something the
# no-storm sumo run failed to learn (melee risk -> cautious draws) and the
# original storm run sidestepped (the closing boundary did the ejecting, agents
# were passive survivors). This config fuses the proven halves:
#
#   * SUMO PHYSICS: low damping (4) + moderate force, so a shove actually sends
#     an opponent sliding toward the edge (with the storm's damping=8 a shove
#     barely moves anyone -- pushing is unlearnable).
#   * BIG ARENA + LONG GRACE: a 2.6 m ring held at full size for the first 300
#     steps gives room to build momentum and time to learn pushing BEFORE any
#     boundary pressure.
#   * GENTLE LATE STORM as a BACKSTOP: after the grace period the ring closes to
#     30% over 200 steps, only to guarantee the match resolves (no infinite
#     draws). It is deliberately late and mild so pushing -- not the storm -- is
#     the primary way to win. The push-shaping reward only credits driving an
#     opponent OUTWARD, so storm-caused ejections (agents move inward) earn no
#     push reward: the gradient still points at genuine shoving.
arena:
  radius: 2.6
  wall_height: 0.5
  damping: 4.0
  min_radius_frac: 0.3   # storm closes to 0.78 m as a backstop
  shrink_delay: 300      # full-size "fighting" grace phase (pure pushing)
  shrink_steps: 200      # then shrink over steps 300..500
training:
  num_agents: 4
  total_steps: 1000000
  snapshot_interval: 10000
  max_force: 16.0        # terminal speed ~4 m/s at damping 4
  snapshot_pool_size: 100
  episode_max_steps: 500 # more time for the behaviour to develop
ppo:
  lr: 0.0003
  n_steps: 2048
  batch_size: 64
  clip_range: 0.2
  n_epochs: 10
evaluation:
  eval_freq: 10000
  num_episodes: 100
  generalization_agent_counts: [4, 6, 8]
