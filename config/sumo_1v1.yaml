# 1v1 sumo: the cleanest setting to LEARN active pushing. Small ring, low
# damping (shoves carry), NO storm -> the only way to win is to shove the single
# opponent out, and there is no melee risk that makes committing to a push
# dangerous.
arena:
  radius: 1.4
  wall_height: 0.5
  damping: 4.0
  min_radius_frac: 1.0   # no storm
  shrink_steps: 0
training:
  num_agents: 2
  total_steps: 300000
  snapshot_interval: 10000
  max_force: 14.0
  snapshot_pool_size: 100
  episode_max_steps: 300
ppo:
  lr: 0.0003
  n_steps: 2048
  batch_size: 64
  clip_range: 0.2
  n_epochs: 10
evaluation:
  eval_freq: 10000
  num_episodes: 100
  generalization_agent_counts: [2, 3, 4]
