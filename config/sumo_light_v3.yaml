# sumo_light + ANGULAR-only spawn jitter: even the win spread WITHOUT killing
# dominance.
#
# v2 (jitter 0.3, angular+radial) evened the balance beautifully (spread 0.19->0.04)
# but the radial component spawned agents near the edge and taught edge-caution
# that collapsed dominance-vs-random (+0.98 -> +0.02, confirmed a policy change,
# not an eval artifact). Only ANGULAR jitter is needed to break the neighbour-tie
# that caused the bias, so jitter is now angular-only and gentler. Everything else
# is identical to sumo_light.
arena:
  radius: 1.2
  wall_height: 0.5
  damping: 4.0
  agent_density: 150.0
  spawn_jitter: 0.2        # ~11 deg angular only (no radial) -- breaks the n-gon tie
  min_radius_frac: 1.0
  shrink_steps: 0
training:
  num_agents: 4
  curriculum_start_agents: 2
  total_steps: 1500000
  snapshot_interval: 10000
  max_force: 14.0
  snapshot_pool_size: 100
  episode_max_steps: 600
  draw_penalty: 1.0
ppo:
  lr: 0.0003
  n_steps: 2048
  batch_size: 64
  clip_range: 0.2
  n_epochs: 10
  gamma: 0.997
evaluation:
  eval_freq: 10000
  num_episodes: 100
  generalization_agent_counts: [4, 6, 8]
