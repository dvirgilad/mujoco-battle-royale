arena:
  # Smaller arena so a push only has to move an opponent ~0.8 m to eject it,
  # making shoving -- not the storm -- the main elimination mechanic.
  radius: 2.2
  wall_height: 0.5
  min_radius_frac: 0.22   # storm closes to ~0.48 m (forces the final resolution)
  shrink_steps: 250
  shrink_delay: 150       # 150-step grace/fighting phase before the storm starts
training:
  num_agents: 4
  total_steps: 300000
  snapshot_interval: 10000
  max_force: 22.0         # a bit slower -> more deliberate sumo pushing
  snapshot_pool_size: 100
  episode_max_steps: 450
ppo:
  lr: 0.0003
  n_steps: 2048
  batch_size: 64
  clip_range: 0.2
  n_epochs: 10
evaluation:
  eval_freq: 10000
  num_episodes: 100
  generalization_agent_counts: [4, 6, 8]
