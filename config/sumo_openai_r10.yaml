# draw=loss + SMALLER arena: attack the n=4 self-ejection loss.
#
# sumo_openai (draw penalty, no storm) was a breakthrough for 1v1 dominance
# (n=2 edge +0.90) but n=4 dominance stayed negative because the agent, now
# forced to clear 3 passive targets, SELF-EJECTS ~51% of the time -- it overshoots
# the edge chasing them (our agents brake slowly, ~175 steps). The eval-time
# sweep showed a smaller arena directly cuts that loss (0.45 -> 0.30) by removing
# overshoot room. So: keep the OpenAI draw=loss incentive, shrink the ring to 1.0,
# and give a little more time to clear. No storm (pushing stays the only win path).
arena:
  radius: 1.0             # was 1.2 -- less room to overshoot into self-elimination
  wall_height: 0.5
  damping: 4.0
  min_radius_frac: 1.0    # no storm
  shrink_steps: 0
training:
  num_agents: 4
  curriculum_start_agents: 2
  total_steps: 1500000
  snapshot_interval: 10000
  max_force: 14.0
  snapshot_pool_size: 100
  episode_max_steps: 700
  draw_penalty: 1.0        # draw == loss
ppo:
  lr: 0.0003
  n_steps: 2048
  batch_size: 64
  clip_range: 0.2
  n_epochs: 10
  gamma: 0.997
evaluation:
  eval_freq: 10000
  num_episodes: 100
  generalization_agent_counts: [4, 6, 8]
