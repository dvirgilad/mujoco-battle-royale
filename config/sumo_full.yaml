# Full 1M sumo run at n=4 (same scale as the storm policy, for comparison).
# Small ring + low damping + NO storm => pushing opponents out is the only way
# to win. The opponent curriculum (random warmup -> self-play) still applies.
arena:
  radius: 1.8
  wall_height: 0.5
  damping: 4.0
  min_radius_frac: 1.0   # no storm
  shrink_steps: 0
training:
  num_agents: 4
  total_steps: 1000000
  snapshot_interval: 10000
  max_force: 14.0
  snapshot_pool_size: 100
  episode_max_steps: 400
ppo:
  lr: 0.0003
  n_steps: 2048
  batch_size: 64
  clip_range: 0.2
  n_epochs: 10
evaluation:
  eval_freq: 10000
  num_episodes: 100
  generalization_agent_counts: [4, 6, 8]
