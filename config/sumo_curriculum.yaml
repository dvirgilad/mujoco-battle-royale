# Agent-count curriculum sumo run: n=2 -> n=4, NO storm.
#
# The hypothesis: pushing is learnable 1v1 (proven: 0.98 self-play resolution)
# but collapses to a cautious no-op when training starts directly at n=4 (proven:
# 0.07 resolution, all draws). Here we start at n=2 so the shove behaviour forms
# with no melee risk, then ramp the agent count to 4 (see Trainer's agent-count
# curriculum) so the policy ADAPTS its existing pushing to a melee instead of
# re-discovering caution from scratch.
#
# NO storm on purpose: with min_radius_frac=1.0 the boundary never closes, so the
# ONLY way to win is to push an opponent out. Any self-play resolution is thus a
# genuine push-out -- the clean test of whether the curriculum delivered active
# pushing at n=4. Physics are the proven sumo settings (low damping so shoves
# actually displace opponents; tight ring so a shove can reach the edge in time).
arena:
  radius: 1.6
  wall_height: 0.5
  damping: 4.0
  min_radius_frac: 1.0   # no storm
  shrink_steps: 0
training:
  num_agents: 4              # final count the curriculum ramps up to
  curriculum_start_agents: 2 # start 1v1, ramp 2 -> 3 -> 4
  total_steps: 1500000       # extra steps: learn pushing, THEN scale it
  snapshot_interval: 10000
  max_force: 14.0
  snapshot_pool_size: 100
  episode_max_steps: 400
ppo:
  lr: 0.0003
  n_steps: 2048
  batch_size: 64
  clip_range: 0.2
  n_epochs: 10
evaluation:
  eval_freq: 10000
  num_episodes: 100
  generalization_agent_counts: [4, 6, 8]
