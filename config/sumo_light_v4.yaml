# sumo_light + neighbour-order shuffle: even the win spread WITHOUT touching the
# physics.
#
# Spawn jitter (v2/v3) evened the balance but collapsed dominance -- perturbing
# the spawn changes the dynamics and the policy retreats to the draw equilibrium.
# The bias's ROOT cause is purely in the observation: on a symmetric spawn the two
# adjacent neighbours are exactly equidistant, so the distance-sort tie-breaks by
# agent index, giving each slot a fixed CW/CCW "first neighbour". shuffle_neighbors
# randomises that tied order during training so the policy becomes order-invariant
# and the bias averages out -- with the IDENTICAL symmetric-n-gon physics as
# sumo_light, so clearing stays exactly as learnable (dominance preserved).
arena:
  radius: 1.2
  wall_height: 0.5
  damping: 4.0
  agent_density: 150.0
  spawn_jitter: 0.0        # no physical perturbation
  min_radius_frac: 1.0
  shrink_steps: 0
training:
  num_agents: 4
  curriculum_start_agents: 2
  total_steps: 1500000
  snapshot_interval: 10000
  max_force: 14.0
  snapshot_pool_size: 100
  episode_max_steps: 600
  draw_penalty: 1.0
  shuffle_neighbors: true  # randomise tied-neighbour order -> order-invariant policy
ppo:
  lr: 0.0003
  n_steps: 2048
  batch_size: 64
  clip_range: 0.2
  n_epochs: 10
  gamma: 0.997
evaluation:
  eval_freq: 10000
  num_episodes: 100
  generalization_agent_counts: [4, 6, 8]
